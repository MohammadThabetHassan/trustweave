[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustweave"
version = "0.3.1"
description = "Local-first security build evidence for AI agent trust boundaries."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Mohammad Thabet Hassan", email = "MohammadThabetHassan@users.noreply.github.com" },
  { name = "Ahmed Sami Alameri", email = "AhmedSamiAlameri@users.noreply.github.com" },
  { name = "Fahad Sadek", email = "fahadALjazzeri@users.noreply.github.com" },
  { name = "Omar Alraas", email = "omaralraas@users.noreply.github.com" },
  { name = "Abdulrahman Rezki", email = "104144822+AbdulrahmanRezki@users.noreply.github.com" },
  { name = "Lobna AbuSerrieh" },
]
keywords = ["ai-agents", "security", "mcp", "policy", "supply-chain", "attestation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
demo = ["Pillow>=10.0"]
dev = [
  "PyYAML>=6.0",
  "build>=1.0",
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "hypothesis>=6.0",
  "jsonschema>=4.0",
  "cyclonedx-bom>=7.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "mutmut==3.7.0",
  # Certifies the witness construction in scripts/verify_witness_space.py. The proof step
  # it checks was wrong once, so the check runs in CI rather than on a maintainer's machine.
  "z3-solver>=4.12",
  "mkdocs-material>=9.5",
]

[project.scripts]
trustweave = "trustweave.cli:main"

[project.urls]
Homepage = "https://github.com/MohammadThabetHassan/trustweave"
Documentation = "https://github.com/MohammadThabetHassan/trustweave/tree/main/docs"
Repository = "https://github.com/MohammadThabetHassan/trustweave"
Issues = "https://github.com/MohammadThabetHassan/trustweave/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustweave = ["py.typed", "schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=trustweave --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 100
target-version = "py311"
# verify_distribution_artifacts.py builds throwaway wheels in ROOT/.trustweave-dist-*.
# Generated probe scripts in there are not project source and must not be linted.
extend-exclude = [
  ".trustweave-dist-*",
  # mutmut's mutated copy of the source tree. Linting it lints generated mutants.
  "mutants",
  # Labelled benchmark inputs. Deliberately odd agent code, parsed and never
  # imported; linting it would be linting the test data.
  "benchmark/tool-classification/cases",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unreachable = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
  "src/trustweave/engine.py",
  "src/trustweave/models.py",
  "src/trustweave/policy_predicates.py",
  "src/trustweave/policy_review.py",
  "src/trustweave/chain.py",
  "src/trustweave/findings.py",
  "src/trustweave/risk.py",
  "src/trustweave/evidence.py",
  "src/trustweave/config.py",
  "src/trustweave/schema_catalog.py",
  "src/trustweave/sarif.py",
  "src/trustweave/commands/ci.py",
  "src/trustweave/bundle_policy.py",
  "src/trustweave/policy_weakening.py",
  # Discovery intake and artifact production. code_analysis.py is not here yet:
  # its kill rate is 70% and raising it is tracked in docs/MUTATION_TESTING.md.
  "src/trustweave/code_sources.py",
  "src/trustweave/code_discovery.py",
  # Ratcheted rather than gated: mutated on every run and held to a floor, but not to the
  # survivor-triage gate. See docs/MUTATION_TESTING.md.
  "src/trustweave/code_analysis.py",
]
also_copy = [
  ".github",
  ".dockerignore",
  ".pre-commit-config.yaml",
  "Dockerfile",
  "README.md",
  "CONTRIBUTING.md",
  "GOVERNANCE.md",
  "SECURITY.md",
  "mkdocs.yml",
  "examples",
  "policies",
  "scenarios",
  "schemas",
  "docs",
  "demo",
  "scripts",
  # scripts/evaluate_classifier.py reads the labelled benchmark; without it the
  # mutation sandbox cannot collect.
  "benchmark",
]
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = [
  "tests",
  "-k",
  "not repository_reality_check and not reality_check_contracts",
]

[tool.coverage.run]
branch = true
source = ["trustweave"]

[tool.coverage.report]
show_missing = true
fail_under = 95
