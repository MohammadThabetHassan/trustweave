name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" bandit build pip-audit

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check core package
        run: mypy src

      - name: Static security scan
        run: bandit -r src/trustweave -q

      - name: Run tests
        run: pytest

      - name: Verify repository reality
        run: python scripts/reality_check.py

      - name: Build distributable packages
        run: python -m build

      - name: Verify the built wheel in isolation
        run: |
          python -m venv .wheel-check
          .wheel-check/bin/pip install dist/*.whl
          .wheel-check/bin/trustweave --help
          rm -rf .wheel-check

      - name: Verify the built source distribution in isolation
        run: |
          python -m venv .sdist-check
          .sdist-check/bin/pip install dist/*.tar.gz
          .sdist-check/bin/trustweave --help
          rm -rf .sdist-check

      - name: Container build and smoke test
        run: |
          docker build --pull=false -t trustweave:0.2.1 .
          docker run --rm trustweave:0.2.1 --help
          docker run --rm trustweave:0.2.1 schema list
          docker run --rm --network none trustweave:0.2.1 schema list
          docker run --rm --entrypoint sh trustweave:0.2.1 -c 'test "$(id -u)" -eq 10001'
          docker run --rm --entrypoint python trustweave:0.2.1 -c 'import trustweave; assert trustweave.__version__ == "0.2.1"'
          docker run --rm --entrypoint sh trustweave:0.2.1 -c 'test -d /usr/local/lib/python3.13/site-packages/trustweave/schemas'
          docker run --rm --user 0 --entrypoint sh trustweave:0.2.1 -c '! find /app -type d -name "__pycache__" -print -quit | grep -q .'
          docker run --rm --user 0 --entrypoint sh trustweave:0.2.1 -c '! test -e /root/.cache/pip && ! test -e /home/trustweave/.cache/pip'

      - name: Verify reproducible wheel build
        run: |
          rm -rf .wheel-repro-a .wheel-repro-b
          SOURCE_DATE_EPOCH=0 python -m build --wheel --outdir .wheel-repro-a
          SOURCE_DATE_EPOCH=0 python -m build --wheel --outdir .wheel-repro-b
          cmp .wheel-repro-a/*.whl .wheel-repro-b/*.whl
          rm -rf .wheel-repro-a .wheel-repro-b

      - name: Audit declared runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Generate reproducible local SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment "$(which python)" --pyproject pyproject.toml --mc-type library --output-reproducible --output-file artifacts/trustweave.cdx.json
          grep -q '"bomFormat": "CycloneDX"' artifacts/trustweave.cdx.json

      - name: Run synthetic evidence and review workflows
        run: |
          trustweave scan --manifest examples/support-agent.manifest.json --policy policies/default-policy.json --output-dir artifacts
          trustweave test --policy policies/default-policy.json --scenarios scenarios/default-scenarios.json --output-dir artifacts
          trustweave test --policy policies/default-policy.json --scenarios scenarios/adversarial-scenarios.json --output-dir artifacts/adversarial
          grep -q '"total": 25' artifacts/adversarial/security-test-results.json
          trustweave explain --scenarios scenarios/adversarial-scenarios.json --scenario-id TW-ADV-001 | grep -q 'OWASP LLM01:2025 Prompt Injection'
          trustweave mcp-import --tool-list examples/mcp-tools/support-tools-list.json --output-dir artifacts/mcp-inventory
          grep -q '"tool_count": 2' artifacts/mcp-inventory/mcp-tool-inventory.json
          trustweave attest --source-revision "$GITHUB_SHA" --output-dir artifacts
          trustweave report --output-dir artifacts
          trustweave verify --attestation artifacts/attestation.json
          trustweave policy-check --policy policies/default-policy.json --output-dir artifacts --exit-on-review
          set +e
          trustweave policy-check --policy examples/policies/approval-control-missing.policy.json --output-dir artifacts/policy-review-required --exit-on-review
          policy_review_exit=$?
          set -e
          test "$policy_review_exit" -eq 1
          grep -q 'TW-POL-004' artifacts/policy-review-required/policy-review.json
          trustweave scan --manifest examples/support-agent.manifest.json --policy policies/default-policy.json --output-dir artifacts/review/base
          trustweave scan --manifest examples/support-agent.candidate.manifest.json --policy policies/default-policy.json --output-dir artifacts/review/head
          trustweave diff --base artifacts/review/base/agent-security-bundle.json --head artifacts/review/head/agent-security-bundle.json --output-dir artifacts/review/diff
          grep -q 'TW-DIFF-001' artifacts/review/diff/bundle-diff.json
          trustweave scan --manifest examples/support-agent.capability-growth.manifest.json --policy policies/default-policy.json --output-dir artifacts/review/capability-head
          trustweave diff --base artifacts/review/base/agent-security-bundle.json --head artifacts/review/capability-head/agent-security-bundle.json --output-dir artifacts/review/capability-diff
          grep -q 'TW-DIFF-003' artifacts/review/capability-diff/bundle-diff.json
          grep -q 'customer-record.export' artifacts/review/capability-diff/bundle-diff.md
          trustweave trace-review --manifest examples/support-agent.manifest.json --policy policies/default-policy.json --trace examples/traces/clear-support-trace.json --output-dir artifacts/trace-clear --exit-on-review
          set +e
          trustweave trace-review --manifest examples/support-agent.manifest.json --policy policies/default-policy.json --trace examples/traces/review-required-support-trace.json --output-dir artifacts/trace-review --exit-on-review
          trace_review_exit=$?
          set -e
          test "$trace_review_exit" -eq 1
          grep -q 'TW-TRACE-004' artifacts/trace-review/trace-review.json
          ! grep -q 'synthetic@example.invalid' artifacts/trace-review/trace-review.md
          trustweave mcp-profile-check --manifest examples/support-agent.manifest.json --profile examples/mcp-profiles/clear-support-profile.json --output-dir artifacts/mcp-clear --exit-on-review
          set +e
          trustweave mcp-profile-check --manifest examples/support-agent.manifest.json --profile examples/mcp-profiles/review-required-support-profile.json --output-dir artifacts/mcp-review --exit-on-review
          mcp_review_exit=$?
          set -e
          test "$mcp_review_exit" -eq 1
          grep -q 'TW-MCP-001' artifacts/mcp-review/mcp-profile-review.json
          ! grep -q 'token=' artifacts/mcp-review/mcp-profile-review.md
          trustweave sarif --policy-review artifacts/policy-review-required/policy-review.json --diff artifacts/review/capability-diff/bundle-diff.json --trace-review artifacts/trace-review/trace-review.json --mcp-profile-review artifacts/mcp-review/mcp-profile-review.json --output artifacts/trustweave.sarif
          grep -q '"version": "2.1.0"' artifacts/trustweave.sarif
          grep -q 'TW-POL-004' artifacts/trustweave.sarif
          grep -q 'TW-DIFF-003' artifacts/trustweave.sarif
          grep -q 'TW-TRACE-004' artifacts/trustweave.sarif
          grep -q 'TW-MCP-001' artifacts/trustweave.sarif

      - name: Upload generated evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trustweave-evidence
          path: artifacts/
          if-no-files-found: error

  composite-action:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository-local action
        id: local-evidence
        uses: ./.github/actions/trustweave
        with:
          manifest: examples/support-agent.manifest.json
          policy: policies/default-policy.json
          scenarios: scenarios/default-scenarios.json
          output-dir: action artifacts

      - name: Verify local action artifacts and outputs
        shell: bash
        run: |
          test -s "${{ steps.local-evidence.outputs.bundle }}"
          test -s "${{ steps.local-evidence.outputs.test-results }}"
          test -s "${{ steps.local-evidence.outputs.policy-review }}"

  compatibility:
    name: Python compatibility (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run compatibility tests
        run: pytest
