site_name: TrustWeave
site_description: Local, deterministic security evidence for declared AI-agent trust boundaries.
site_url: https://mohammadthabethassan.github.io/trustweave/
repo_name: MohammadThabetHassan/trustweave
repo_url: https://github.com/MohammadThabetHassan/trustweave
edit_uri: edit/main/docs/site/
docs_dir: docs/site
strict: true
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Getting started:
      - Installation and quick start: INSTALLATION.md
      - Configuration: CONFIGURATION.md
      - Troubleshooting and limitations: TROUBLESHOOTING.md
  - Concepts:
      - Concepts: concepts.md
      - Manifest, tags, and classifications: MANIFEST_CONTRACT.md
      - Declared chain model: CHAIN_MODEL.md
      - Threat model: THREAT_MODEL.md
      - Public API and exports: PUBLIC_API.md
  - How-to:
      - Developer integration routes: INTEGRATIONS.md
      - Local CI workflow: CI_WORKFLOW.md
      - MCP metadata workflows: MCP_METADATA.md
      - Reviewer workflow (site): MAINTAINERS.md
  - CLI:
      - Guide: CLI.md
      - Generated help: CLI_HELP.md
      - Rule catalog: RULE_CATALOG.md
      - Schema catalog: SCHEMAS.md
  - Policies and risk:
      - Policy versions and controls: POLICY_VERSIONS.md
      - Policy review and coverage: POLICY_REVIEW.md
      - Risk identities and lifecycle: RISK_MANAGEMENT.md
  - Assurance:
      - Assurance controls: ASSURANCE.md
      - Synthetic evaluation framework: EVALUATION.md
      - Provenance design: PROVENANCE.md
      - Performance gates: PERFORMANCE.md
  - Releases:
      - Release process: RELEASE.md
      - Release evidence 0.3.0: RELEASE_EVIDENCE_0.3.0.md
      - Release evidence 0.2.3: RELEASE_EVIDENCE_0.2.3.md
      - Migration to 0.2.0: MIGRATION_0_2.md
