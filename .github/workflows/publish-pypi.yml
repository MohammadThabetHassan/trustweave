name: Publish PyPI release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact final package version expected from pyproject.toml
        required: true
        default: 0.1.1
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build PyPI distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Verify intended version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$package_version" = "$EXPECTED_VERSION"
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Upload distributions for the isolated publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trustweave/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: false
