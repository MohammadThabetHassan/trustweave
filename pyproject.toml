[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustweave"
version = "0.1.1"
description = "Local-first security build evidence for AI agent trust boundaries."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "TrustWeave Contributors" }
]
keywords = ["ai-agents", "security", "mcp", "policy", "supply-chain", "attestation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
  "PyYAML>=6.0",
  "build>=1.0",
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "hypothesis>=6.0",
  "jsonschema>=4.0",
  "cyclonedx-bom>=7.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "mutmut==3.7.0",
]

[project.scripts]
trustweave = "trustweave.cli:main"

[project.urls]
Homepage = "https://github.com/MohammadThabetHassan/trustweave"
Documentation = "https://github.com/MohammadThabetHassan/trustweave/tree/main/docs"
Repository = "https://github.com/MohammadThabetHassan/trustweave"
Issues = "https://github.com/MohammadThabetHassan/trustweave/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustweave = ["py.typed", "schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=trustweave --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unreachable = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/trustweave/engine.py"]
also_copy = ["examples", "policies", "scenarios", "schemas", "docs"]
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = [
  "tests/test_trustweave.py",
  "tests/test_foundation_hardening.py",
  "-k",
  "not repository_reality_check",
]

[tool.coverage.run]
branch = true
source = ["trustweave"]

[tool.coverage.report]
show_missing = true
fail_under = 90
