name: Reproduction image

# Builds the image the paper's measurements can be reproduced in (reproduce/Dockerfile) and runs
# its fast checks: the tool versions the artifacts record, the pre-registration check, the
# study scripts' tests and the solver check of the witness construction. The hours-long studies
# and the corpus re-measurement are run by hand; reproduce/README.md gives their commands.

on:
  pull_request:
    paths:
      - "reproduce/**"
      - "scripts/**"
      - "docs/*.json"
      - "docs/*PROTOCOL*.md"
      - "pyproject.toml"
      - ".github/workflows/reproduce.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and verify the reproduction image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -f reproduce/Dockerfile -t trustweave-reproduce .

      - name: Run the fast checks inside it
        run: docker run --rm trustweave-reproduce verify
