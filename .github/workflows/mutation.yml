name: Mutation quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mutation-quality:
    name: Mutation quality and survivor gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and mutation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run selected mutation scope
        shell: bash
        run: |
          set -o pipefail
          env -u GITHUB_SHA mutmut run 2>&1 | tee mutation-run.log
          mutmut results --all true > mutation-results.txt

      - name: Mutation quality and survivor gate
        shell: bash
        run: |
          python scripts/mutation_gate.py \
            --run-log mutation-run.log \
            --results mutation-results.txt \
            --ratchet docs/mutation-ratchet-v1.json \
            --evidence mutation-quality.json

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-quality-evidence
          path: |
            mutation-run.log
            mutation-results.txt
            mutation-quality.json
            docs/mutation-survivor-triage-v1.json
            docs/mutation-ratchet-v1.json
          if-no-files-found: warn
