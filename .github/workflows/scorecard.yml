name: Manual OpenSSF Scorecard assessment

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Owner-recorded reason for this manual assessment"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard assessment
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard assessment
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Retain assessment artifact for owner review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 7
