[project]
name = "trustweave-langgraph-minimal-example"
version = "0.0.0"
description = "Source-only LangGraph-style configuration fixture for TrustWeave static import proof."
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
