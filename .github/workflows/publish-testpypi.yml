name: Publish TestPyPI candidate

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version expected from pyproject.toml
        required: true
        default: 0.1.1rc1
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build TestPyPI distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Verify intended version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$package_version" = "$EXPECTED_VERSION"
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Upload distributions for the isolated publish job
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
      - name: Publish through TestPyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
