name: Publish TestPyPI candidate

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version expected from pyproject.toml
        required: true
        default: 0.2.3
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    name: Verify exact annotated release target and local release checks
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.release_target.outputs.sha }}
    steps:
      - name: Check out the selected release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify annotated tag reference and target SHA
        id: release_target
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          expected_tag_ref="refs/tags/v${EXPECTED_VERSION}"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v${EXPECTED_VERSION}"
          test "$GITHUB_REF" = "$expected_tag_ref"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          tag_target_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")"
          test "$tag_target_sha" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$tag_target_sha"
          printf 'sha=%s\n' "$tag_target_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install release-gate tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" bandit build pip-audit twine
      - name: Run required local release checks for the tag target
        run: |
          ruff format --check .
          ruff check .
          mypy src
          bandit -r src/trustweave -q
          pytest
          python scripts/reality_check.py
          mkdocs build --strict
          pip-audit -r requirements.txt

  build:
    name: Build TestPyPI distributions
    needs: release-gate
    if: needs.release-gate.outputs.target_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checked-out SHA matches the passed release gate
        env:
          TARGET_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Verify intended version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$package_version" = "$EXPECTED_VERSION"
      - name: Build distributions from the verified target
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Upload distributions for the isolated publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to TestPyPI
    needs: [release-gate, build]
    if: needs.release-gate.outputs.target_sha == github.sha && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-distributions
          path: dist/
      - name: Publish through TestPyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
